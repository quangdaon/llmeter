<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Orange base (human half) -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#f97316"/>
  <!-- Indigo right half (AI) — follows rounded-rect curve on the right -->
  <path d="M16,1 L24,1 Q31,1 31,8 L31,24 Q31,31 24,31 L16,31 Z" fill="#6366f1"/>
  <!-- Centre seam -->
  <line x1="16" y1="1" x2="16" y2="31" stroke="white" stroke-width="1.5" opacity="0.5"/>
  <!-- Left eye: soft circle (human) -->
  <circle cx="11" cy="14" r="3" fill="white"/>
  <!-- Right eye: rounded square (robotic) -->
  <rect x="18.5" y="11" width="5" height="5" rx="1.5" fill="white"/>
  <!-- Mouth: neutral bar spanning both halves -->
  <rect x="10.5" y="21.5" width="11" height="2" rx="1" fill="white" opacity="0.7"/>
</svg>
